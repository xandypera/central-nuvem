<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Gerador de Slides Sardinha Data</title>
  <desc id="desc">Capa corporativa em vermelho para o playbook de slides.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E0A0D"/>
      <stop offset="0.52" stop-color="#941D28"/>
      <stop offset="1" stop-color="#D6434D"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#1B0305" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1440" cy="110" r="360" fill="#FF6D71" opacity=".22"/>
  <circle cx="160" cy="860" r="390" fill="#120103" opacity=".28"/>
  <g opacity=".22" fill="none" stroke="#fff" stroke-width="2"><path d="M90 120h465M90 170h650M90 220h370"/><path d="M1040 730h430M1110 780h360M1180 830h290"/></g>
  <g transform="translate(1030 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="255" rx="28" fill="#FFF7F4"/>
    <rect x="28" y="32" width="334" height="22" rx="11" fill="#D6404B"/>
    <rect x="28" y="85" width="185" height="94" rx="15" fill="#F1D7D8"/>
    <rect x="236" y="85" width="126" height="45" rx="12" fill="#70202A"/>
    <rect x="236" y="147" width="126" height="32" rx="12" fill="#E8A8AC"/>
