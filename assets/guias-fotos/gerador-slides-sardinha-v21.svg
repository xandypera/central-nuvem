  </g>
  <text x="128" y="218" fill="#FFD3D5" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="8">PLAYBOOK</text>
  <text x="120" y="380" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">GERADOR</text>
  <text x="120" y="485" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">DE SLIDES</text>
  <text x="124" y="578" fill="#FFD3D5" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600">SARDINHA DATA</text>
  <text x="126" y="666" fill="#FFE8E8" font-family="Arial, Helvetica, sans-serif" font-size="28">Telas animadas, dados claros e padrão visual.</text>
