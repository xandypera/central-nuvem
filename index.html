<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central do Editor alpha</title>
<style>
:root{
  --bg:#F1EFE9;--surface:#FFFFFF;--surface2:#F6F4EE;--surface3:#EDEAE2;--line:#D9D5CC;--line2:#CBC6BB;
  --ink:#201F1B;--mut:#77736B;--mut2:#9a958b;--gold:#E8A927;--gold-dim:#F6E9C7;--gold-ink:#8a6a12;
  --red:#e5555a;--red-dim:#3a1a1c;--green:#4bb96a;--green-dim:#123020;--blue:#5b8def;--r:14px;--r-sm:9px;
  --headerbg:#171717;--header-ink:#f4f2ee;--header-mut:#a8a29a;
  --ff:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
/* a paleta é aplicada por JS conforme o perfil de cores; body.light mantém ajustes semânticos de tema claro */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
button,input,select,textarea{font:inherit;color:inherit;} ::selection{background:var(--gold);color:#111;}
header{position:sticky;top:0;z-index:20;background:var(--headerbg);border-bottom:1px solid rgba(255,255,255,.06);}
.hin{max-width:1120px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--header-ink);}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;}
.tabs button{font-size:13.5px;color:var(--header-mut);padding:9px 12px 10px;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;transition:.15s;}
.tabs button:hover{color:var(--header-ink);} .tabs button.active{color:var(--header-ink);border-bottom-color:var(--gold);font-weight:700;}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;}
.avatar-wrap{position:relative;}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--surface3);color:var(--gold);font-weight:800;font-size:13px;cursor:pointer;overflow:hidden;} .avatar:hover{border-color:var(--gold);} .avatar img{width:100%;height:100%;object-fit:cover;} .avatar.sm{width:34px;height:34px;font-size:12px;}
.menu{position:absolute;right:0;top:46px;width:250px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:8px;display:none;z-index:70;} .menu.show{display:block;}
.menu-head{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);margin-bottom:6px;}
.menu-item{display:block;width:100%;text-align:left;background:none;border:none;padding:10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink);} .menu-item:hover{background:var(--surface2);} .menu-item.danger{color:#ff9ea0;}
.wrap{max-width:1120px;margin:0 auto;padding:26px 22px 90px;}
.screen{display:none;} .screen.active{display:block;animation:f .25s ease;}
@keyframes f{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;} .sub{color:var(--mut);font-size:14.5px;margin-top:4px;}
.row{display:flex;align-items:center;gap:12px;} .between{justify-content:space-between;} .wrapf{flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--gold);transform:translateY(-1px);} .btn.gold{background:var(--gold);color:#1a1400;border-color:var(--gold);} .btn.sm{padding:7px 11px;font-size:12.5px;} .btn.ghost{background:transparent;} .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;}
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--mut);}
.pill.g{background:var(--green-dim);border-color:#1c5a34;color:#8fe0a6;} .pill.gold{background:var(--gold-dim);border-color:#6a531a;color:var(--gold-ink);} .pill.b{background:#10203a;border-color:#26406e;color:#9dc0ff;}
body.light .pill.g{background:#e7f6ec;color:#1e7a3c;} body.light .pill.b{background:#e8f0ff;color:#2a5bb0;} body.light .pill.gold{background:#fbf1d6;color:#8a6a12;}
.grid{display:grid;gap:14px;} .g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr;}} @media(max-width:560px){.g4{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.2s;}
.card.hoverable{cursor:pointer;} .card.hoverable:hover{transform:translateY(-3px);border-color:var(--gold);}
.muted{color:var(--mut);font-size:13px;} .big{font-size:15px;font-weight:700;} .mono{font-variant-numeric:tabular-nums;}
.kpi{font-size:22px;font-weight:800;} .bar{height:8px;background:var(--surface3);border-radius:5px;overflow:hidden;margin-top:8px;} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2f8f4d);}
.clock-box{text-align:right;} .clock-box .ct{font-size:23px;font-weight:800;} .clock-box .cd{font-size:12px;text-transform:capitalize;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 6px;}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 13px;} .search input{background:none;border:none;outline:none;width:100%;font-size:14px;} .search svg{width:16px;height:16px;color:var(--mut);flex:none;}
.sel{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;cursor:pointer;}
.chips{display:flex;gap:7px;flex-wrap:wrap;} .chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:12.5px;color:var(--mut);} .chip.on{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:700;}
.empty-state{text-align:center;padding:56px 20px;border:1.5px dashed var(--line2);border-radius:16px;margin-top:20px;} .es-ic svg{width:48px;height:48px;color:var(--gold);} .es-t{font-size:18px;font-weight:800;margin-top:12px;} .es-s{color:var(--mut);font-size:14px;margin:6px auto 0;max-width:420px;}
/* timer */
.timer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;} .timer.run{border-color:#1c5a34;}
.t-head{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;}
.t-ic{width:38px;height:38px;border-radius:10px;background:var(--surface3);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none;font-size:17px;} .timer.run .t-ic{color:var(--green);}
.t-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex:1;} .pencil{opacity:.5;color:var(--mut2);font-size:13px;cursor:pointer;} .pencil:hover{opacity:1;color:var(--gold);}
.t-time{font-size:19px;font-weight:800;} .t-time.run{color:var(--green);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;animation:pulse 1.4s infinite;} @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.chev{color:var(--mut);transition:.2s;} .timer.open .chev{transform:rotate(180deg);}
.t-body{display:none;padding:0 16px 15px;border-top:1px solid var(--line);} .timer.open .t-body{display:block;}
.t-controls{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;}
.cbtn{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;} .cbtn:hover{border-color:var(--gold);} .cbtn.play{background:var(--green);border-color:var(--green);color:#04210b;} .cbtn.pause{background:var(--gold);border-color:var(--gold);color:#1a1400;} .cbtn.stop{color:#ff9ea0;}
.edit-time{display:none;margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;} .edit-time.show{display:block;}
.tt-in{width:56px;text-align:center;background:var(--surface3);border:1px solid var(--line);border-radius:8px;padding:8px;}
.t-meta{display:flex;gap:10px;align-items:center;margin-top:13px;flex-wrap:wrap;}
.icon-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;} .icon-btn:hover{border-color:var(--gold);color:var(--ink);}
.new-timer{border:1.5px dashed var(--line2);border-radius:var(--r);padding:14px;text-align:center;color:var(--mut);cursor:pointer;} .new-timer:hover{border-color:var(--gold);color:var(--ink);}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600;} .inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;}
.bridge{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(90deg,var(--gold-dim),transparent);border:1px solid #6a531a;border-radius:var(--r);padding:16px 18px;flex-wrap:wrap;} body.light .bridge{background:linear-gradient(90deg,#fbf1d6,transparent);border-color:#e3cd8f;}
/* drawer */
.dback{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:.2s;z-index:40;} .dback.show{opacity:1;visibility:visible;}
.draw{position:fixed;top:0;right:0;height:100%;width:min(400px,92vw);background:var(--surface);border-left:1px solid var(--line2);z-index:41;transform:translateX(100%);transition:.35s cubic-bezier(.16,1,.3,1);padding:24px;overflow:auto;} .draw.show{transform:none;} .draw .close{position:absolute;top:16px;right:16px;background:var(--surface2);border:1px solid var(--line);width:32px;height:32px;border-radius:9px;cursor:pointer;}
.cmt{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;} .cmt .h{font-size:12px;color:var(--mut2);margin-bottom:4px;display:flex;gap:8px;align-items:center;} .cmt .stamp{background:var(--gold-dim);color:var(--gold-ink);border-radius:20px;padding:1px 8px;font-weight:700;} body.light .cmt .stamp{background:#fbf1d6;} .cmt .t{font-size:14px;}
/* modal */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:.2s;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;overflow:auto;} .mback.show{opacity:1;visibility:visible;}
.modal{width:min(560px,96vw);background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:24px;} .modal h3{font-size:20px;font-weight:800;margin-bottom:4px;} .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;} @media(max-width:520px){.frow{grid-template-columns:1fr;}} .field{margin-top:12px;}
/* dashboard */
.kcard .lab{color:var(--mut);font-size:13px;} .kcard .val{font-size:28px;font-weight:800;margin-top:4px;}
.chart{display:flex;flex-direction:column;gap:10px;margin-top:6px;} .crow{display:grid;grid-template-columns:120px 1fr 70px;align-items:center;gap:12px;font-size:13.5px;} .crow .tk{height:14px;background:var(--surface3);border-radius:7px;overflow:hidden;} .crow .fl{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--gold),#b98a1f);} .crow .vv{text-align:right;color:var(--mut);}
.evo{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:26px;} .evo .b{flex:1;background:linear-gradient(var(--blue),#2c5bb0);border-radius:6px 6px 0 0;position:relative;min-height:2px;} .evo .b span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);} .evo .b small{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px;} .tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;} .tbl th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;}
.mini{font-size:12px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;} .mini:hover{border-color:var(--gold);}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;} .seg button{padding:9px 15px;background:var(--surface2);border:none;border-left:1px solid var(--line);cursor:pointer;color:var(--mut);font-size:13.5px;} .seg button:first-child{border-left:none;} .seg button.on{background:var(--ink);color:var(--bg);font-weight:700;}
/* checklist */
.steps-top{display:flex;align-items:center;gap:8px;margin:18px 0;flex-wrap:wrap;} .stepdot{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;} .stepdot .n{width:26px;height:26px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:1px solid var(--line2);} .stepdot.on .n{background:var(--gold);color:#1a1400;border-color:var(--gold);} .stepdot.done .n{background:var(--green);color:#04210b;border-color:var(--green);} .stepline{flex:1;height:2px;background:var(--line);min-width:20px;}
.cl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;border-top:4px solid var(--line2);} .cl-card.B{border-top-color:var(--red);} .cl-card.Q{border-top-color:var(--gold);} .cl-card.A{border-top-color:var(--blue);}
.cl-badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;} .cl-badge.B{background:var(--red-dim);color:#ff9ea0;} .cl-badge.Q{background:#2a2410;color:#e6c86a;} .cl-badge.A{background:#10222a;color:#7ec7dc;}
body.light .cl-badge.B{background:#fde7e8;color:#c0343a;} body.light .cl-badge.Q{background:#fbf1d6;color:#8a6a12;} body.light .cl-badge.A{background:#e6f2f7;color:#1f6b86;}
.cl-item{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer;} .cl-item:first-child{border-top:none;} .chk{width:24px;height:24px;border-radius:7px;border:1.7px solid var(--line2);background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;} .cl-item.done .chk{background:var(--green);border-color:var(--green);} .cl-item.done .chk::after{content:"✓";color:#04210b;font-weight:800;font-size:14px;} .cl-item.done .lbl{color:var(--mut);text-decoration:line-through;} .lbl{font-size:14.5px;}
.cl-prog{height:8px;background:var(--surface3);border-radius:5px;overflow:hidden;margin-top:8px;} .cl-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2f8f4d);transition:width .3s;}
.cl-nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
.cl-msg{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:13.5px;display:none;} .cl-msg.show{display:block;} .cl-msg.error{background:var(--red-dim);border:1px solid #63282b;color:#ff9ea0;} .cl-msg.warn{background:#2a2410;border:1px solid #5c4d18;color:#e6c86a;} body.light .cl-msg.error{background:#fde7e8;color:#c0343a;} body.light .cl-msg.warn{background:#fbf1d6;color:#8a6a12;} .cl-msg .row-b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}} .cl-card.shake{animation:shake .5s;border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(229,85,90,.22);}
.celebrate{display:none;text-align:center;padding:40px 20px;position:relative;overflow:hidden;} .celebrate.show{display:block;} .checkwrap svg{width:120px;height:120px;} .cc-circle{stroke:var(--green);stroke-width:5;fill:none;stroke-dasharray:308;stroke-dashoffset:308;animation:draw .6s ease forwards;} .cc-check{stroke:var(--green);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .5s ease forwards;} @keyframes draw{to{stroke-dashoffset:0;}}
.confetti{position:absolute;top:-10px;width:9px;height:14px;animation:fall 2.6s linear forwards;} @keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0;}}
.skip-list{max-width:540px;margin:16px auto 0;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;} .skip-list .si{font-size:13.5px;color:var(--mut);padding:3px 0;}
/* settings */
.set-sec{margin-top:16px;} .set-sec h3{font-size:16px;font-weight:800;} .switch{width:46px;height:26px;border-radius:20px;background:var(--surface3);border:1px solid var(--line2);position:relative;cursor:pointer;flex:none;} .switch.on{background:var(--green);border-color:var(--green);} .switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;} .switch.on i{left:22px;}
.link-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin-bottom:8px;} @media(max-width:560px){.link-row{grid-template-columns:80px 1fr;}}
.avatar-big{width:84px;height:84px;border-radius:50%;background:var(--surface3);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;font-size:26px;flex:none;overflow:hidden;} .avatar-big img{width:100%;height:100%;object-fit:cover;}
.ch-ic{width:42px;height:42px;border-radius:10px;background:#2a1416;color:#ff8a8d;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;} body.light .ch-ic{background:#fde7e8;color:#d0454a;}
/* pomodoro */
.pomo{display:flex;flex-direction:column;align-items:center;text-align:center;} .ring{width:220px;height:220px;border-radius:50%;border:8px solid var(--surface3);border-top-color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:10px 0;} .ring .tt{font-size:44px;font-weight:800;} .ring .st{color:var(--mut);font-size:13px;} .cyc{display:flex;gap:8px;margin:8px 0;} .cyc i{width:12px;height:12px;border-radius:50%;background:var(--surface3);} .cyc i.on{background:var(--gold);}
.note{background:var(--surface2);border-left:2px solid var(--gold);border-radius:8px;padding:12px 14px;color:var(--mut);font-size:13.5px;margin-top:14px;}
.ver{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:600;color:var(--gold);font-size:14px;letter-spacing:.02em;}
.hbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);cursor:pointer;font-size:12px;} .hbtn:hover{border-color:var(--gold);}
.ring.foco{border-top-color:var(--gold);} .ring.pausa{border-top-color:var(--green);} .ring.longa{border-top-color:var(--blue);}
.ring.run{animation:ringpulse 1.7s ease-in-out infinite;}
.ring.run.foco{border-color:var(--gold);box-shadow:0 0 26px rgba(226,178,60,.5);}
.ring.run.pausa{border-color:var(--green);box-shadow:0 0 26px rgba(75,185,106,.5);}
.ring.run.longa{border-color:var(--blue);box-shadow:0 0 26px rgba(91,141,239,.5);}
@keyframes ringpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
.player-frame{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#000;} .player-frame iframe{width:100%;height:240px;border:0;display:block;} .player-frame.audio iframe{height:152px;} .player-frame.spbig iframe{height:352px;}
.sp-list{max-height:240px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px;} .sp-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--surface2);} .sp-item:hover{border-color:var(--gold);} .sp-item img{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface3);} code{background:var(--surface3);padding:1px 6px;border-radius:5px;font-size:12px;word-break:break-all;}
.ring-wrap{position:relative;width:220px;height:220px;margin:10px 0;} .pring{width:220px;height:220px;transform:rotate(-90deg);} .pring-bg{fill:none;stroke:var(--surface3);stroke-width:9;} .pring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .4s linear;} .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.prof-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;} @media(max-width:640px){.prof-grid{grid-template-columns:repeat(2,1fr);}}
.prof{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:.15s;} .prof:hover{border-color:var(--gold);} .prof.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-dim);}

  window.cloudLogout=async function(){ try{ sbc&&await sbc.auth.signOut(); }catch(e){} try{ localStorage.removeItem(APP_KEY); }catch(e){} location.reload(); };
  function runApp(){ const el=$g('appcode'); if(!el||window.__appran)return; window.__appran=true; const s=document.createElement('script'); s.textContent=el.textContent; document.body.appendChild(s); }
  async function pullOrMigrate(){
    try{
      const {data}=await sbc.from('dados_central').select('conteudo').eq('user_id',SB_USER.id).maybeSingle();
      const local=localStorage.getItem(APP_KEY);
      if(data&&data.conteudo&&Object.keys(data.conteudo).length){ localStorage.setItem(APP_KEY,JSON.stringify(data.conteudo)); }
      else if(local){ try{ await sbc.from('dados_central').upsert({user_id:SB_USER.id,conteudo:JSON.parse(local)}); }catch(e){} }
    }catch(e){}
  }
  async function startAuthed(){ await pullOrMigrate(); const g=$g('authGate'); if(g)g.style.display='none'; runApp(); }
  window.agToggle=function(){ _signup=!_signup; $g('agBtn').textContent=_signup?'Criar conta':'Entrar'; $g('agSub').textContent=_signup?'Crie sua conta para salvar tudo na nuvem.':'Entre para acessar seus projetos na nuvem.'; $g('agToggleWrap').innerHTML=_signup?'Já tem conta? <a onclick="agToggle()">Entrar</a>':'Ainda não tem conta? <a onclick="agToggle()">Criar conta</a>'; $g('agErr').textContent=''; };
  function traduz(m){ m=(m||'').toLowerCase(); if(m.includes('invalid login')) return 'E-mail ou senha incorretos.'; if(m.includes('already')) return 'Esse e-mail já tem conta. Clique em Entrar.'; if(m.includes('password')) return 'Senha muito curta (mínimo 6 caracteres).'; if(m.includes('email')) return 'E-mail inválido.'; return 'Não foi possível. Verifique os dados e tente de novo.'; }
  window.agSubmit=async function(){
    if(!sbc){ $g('agErr').textContent='Supabase não carregou. Recarregue a página.'; return; }
    const email=($g('agEmail').value||'').trim(); const pass=$g('agPass').value||'';
    const err=$g('agErr'); err.textContent='';
    if(!email||pass.length<6){ err.textContent='Informe e-mail e senha (mín. 6 caracteres).'; return; }
    $g('agLoad').style.display='block';
    try{
      let res = _signup ? await sbc.auth.signUp({email,password:pass}) : await sbc.auth.signInWithPassword({email,password:pass});
      if(res.error){ err.textContent=traduz(res.error.message); $g('agLoad').style.display='none'; return; }
      let s=(await sbc.auth.getSession()).data.session;
      if(!s){ const r2=await sbc.auth.signInWithPassword({email,password:pass}); if(r2.error){ err.textContent=traduz(r2.error.message); $g('agLoad').style.display='none'; return; } s=(await sbc.auth.getSession()).data.session; }
      SB_USER=s.user; await startAuthed();
    }catch(e){ err.textContent='Erro de conexão. Tente de novo.'; $g('agLoad').style.display='none'; }
  };
  (async function boot(){
    const g=$g('authGate');
    if(!sbc){ if(g)g.style.display='flex'; $g('agErr').textContent='Falha ao carregar o Supabase.'; return; }
    try{ const {data:{session}}=await sbc.auth.getSession(); if(session){ SB_USER=session.user; await startAuthed(); return; } }catch(e){}
    if(g)g.style.display='flex';
  })();
})();
</script>

[{id:"aviso_horas",nome:"Enviar horas extras",tipo:"mensal",dia:20,ativo:true,fixo:true,grau:"importante",som:"ding"},{id:"aviso_relatorio",nome:"Enviar o relatório",tipo:"mensal",dia:20,ativo:true,fixo:true,grau:"importante",som:"ding"}].forEach(fx=>{if(!DB.avisos.some(a=>a.id===fx.id))DB.avisos.unshift(fx);});

  (p.timers||[]).forEach(t=>{ if(t.segs===undefined){t.segs=[]; t.manual=(t.accumulated||0);} if(t.manual===undefined)t.manual=0; }); });

 {k:'B',nome:'Bloqueadores',desc:'Obrigatórios — impedem a publicação se falharem.',items:['Dados e valores conferidos','Áudio íntegro (sem falha/faltando)','Sentido da fala preservado nos cortes','Telas essenciais corretas','Enquadramento seguro (Raul no quadro)','Sem informação sigilosa na tela','Export técnico conferido']},
 {k:'Q',nome:'Qualidade',desc:'Priorizar conforme o tempo disponível.',items:['Manchetes revisadas','Lettering legível no celular','Ritmo/tempo de leitura bom','Imagens de apoio corretas','Correções visuais de clareza']},
 {k:'A',nome:'Acabamento',desc:'Refinos — podem ser reduzidos sob prazo.',items:['Animações elaboradas','Inserts decorativos','Sound design adicional','Refino estético final']}

/* ============================ UTIL ============================ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1500);}
function pad(n){return String(n).padStart(2,'0');}
function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h+":"+pad(m)+":"+pad(s);}
function fmtShort(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h+":"+pad(m);}
function fmtDateBR(iso){if(!iso)return"—";const p=iso.slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function nowClock(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function openLink(u){if(u&&u!=="#"&&u.trim())window.open(u,"_blank","noopener");else toast("Link não configurado.");}
function initials(name){return (name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");}

/* elapsed de um cronômetro (conta em tempo real, mesmo após fechar) */
function segDur(t){return (t.segs||[]).reduce((a,s)=>a+(s.e-s.s),0)/1000;}
function elapsed(t){let e=(t.manual||0)+segDur(t);if(t.status==='running'&&t.startedAt)e+=(Date.now()-t.startedAt)/1000;return e;}
function unionSeconds(iv){if(!iv.length)return 0;iv.sort((a,b)=>a[0]-b[0]);let tot=0,cs=iv[0][0],ce=iv[0][1];for(let i=1;i<iv.length;i++){const s=iv[i][0],e=iv[i][1];if(s>ce){tot+=ce-cs;cs=s;ce=e;}else if(e>ce)ce=e;}tot+=ce-cs;return tot/1000;}
function projectTotal(p){const now=Date.now();let manual=0;const iv=[];p.timers.forEach(t=>{manual+=(t.manual||0);(t.segs||[]).forEach(s=>iv.push([s.s,s.e]));if(t.status==='running'&&t.startedAt)iv.push([t.startedAt,now]);});return manual+unionSeconds(iv);}
function checklistPct(p){const c=p.checklist||emptyChecklist();let tot=0,done=0;c.forEach(sec=>sec.forEach(v=>{tot++;if(v)done++;}));return tot?Math.round(done/tot*100):0;}

/* ============================ NAVEGAÇÃO ============================ */
let current='projetos', openProjectId=null;
function go(s){

  $$('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));

  if(s==='pomodoro')renderPomodoro();
  window.scrollTo({top:0,behavior:'smooth'});
  if(typeof positionDock==='function')setTimeout(positionDock,60);
}
$$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.s));

/* ============================ PROJETOS ============================ */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let pQuery="",pCanal="Todos",pPrograma="Todos",pSort="data",pStatus="todas",pView=(DB.prefs.projView||'grade'),pYear=String(new Date().getFullYear()),pMonth=new Date().getMonth();
function programaClass(pr){return pr==="Giro da Bolsa"?"b":(pr&&pr.startsWith("Diário"))?"gold":"";}
function projYear(p){return (p.data&&/^\d{4}/.test(p.data))?p.data.slice(0,4):null;}
function projMonth(p){return (p.data&&/^\d{4}-\d{2}/.test(p.data))?(+p.data.slice(5,7)-1):null;}
function isVideoCanal(c){return !!c && c!=='Interno / Outro';}
function projDone(p){return !!p.done;}
function statusSelo(p){return projDone(p)?'<span class="pill done">✅ Concluída</span>':'<span class="pill andamento">🟡 Em andamento</span>';}
function fmtDT(ts){return ts?new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}
function toggleDone(id){const p=getProject(id);if(!p)return;
  if(!p.done && checklistPct(p)<100){toast('Termine o checklist (100%) antes de concluir.');if(current==='projeto')openChecklist(id);return;}
  const finish=()=>{p.done=!p.done;if(p.done){p.status='publicado';p.doneAt=Date.now();}save();if(current==='projeto')openProject(id);else drawProjects();toast(p.done?'Marcada como concluída.':'Reaberta (em andamento).');};
  if(!p.done)confirmAction('Concluir o projeto "'+p.nome+'"? Ele passa para Concluída (dá pra reabrir depois).',finish);else finish();}
function renderProjetos(){
  const el=$("#s-projetos");
  el.innerHTML=`
   <div class="row between wrapf">
     <div><h1>Olá, ${esc((DB.profile.name||'editor').split(' ')[0])}</h1><div class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})} · seus projetos e cronômetros</div></div>
     <div class="row" style="gap:14px"><div class="clock-box"><div class="ct mono" id="clockT">--:--:--</div><div class="cd muted" id="clockD"></div></div><button class="btn gold" onclick="newProjectModal()">+ Novo projeto</button></div>
   </div>
   <div class="toolbar">
     <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg><input id="pSearch" placeholder="Buscar projeto por nome..."></div>
     <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">
       <div class="seg" id="pStatusSeg"><button data-s="todas">Todas</button><button data-s="andamento">Em andamento</button><button data-s="concluida">Concluídas</button></div>
       <select class="sel" id="pSort"><option value="data">Ordenar: Data</option><option value="nome">Ordenar: Nome</option><option value="tempo">Ordenar: Tempo</option><option value="tipo">Ordenar: Programa</option></select>
       <div class="viewtog"><button id="vGrade" title="Grade">▦</button><button id="vLista" title="Lista">☰</button></div>
     </div>
   </div>
   <div class="chips" id="pCanais" style="margin-bottom:8px"></div>
   <div class="chips" id="pProgramas" style="margin-bottom:6px"></div>
   <div class="crumb" id="pCrumb"></div>
   <div class="grid g3" id="pGrid" style="margin-top:12px"></div>
   <div class="empty-state" id="pEmpty" style="display:none"><div class="es-ic"><svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M6 18h36v20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V18z"/><path d="M6.4 9.6 40 4.6l1.3 8.4L7.7 18 6.4 9.6z"/></svg></div><div class="es-t">Nenhum projeto por aqui ainda</div><div class="es-s">Crie seu primeiro projeto para começar a cronometrar as etapas da edição e gerar relatórios.</div><button class="btn gold" onclick="newProjectModal()" style="margin-top:14px">+ Novo projeto</button></div>`;
  renderCanalChips();
  $("#pSearch").value=pQuery; $("#pSort").value=pSort;
  $("#pSearch").oninput=e=>{pQuery=e.target.value;drawProjects();};

  $("#vLista").onclick=()=>{pView='lista';DB.prefs.projView='lista';save();$("#vLista").classList.add('on');$("#vGrade").classList.remove('on');drawProjects();};
  drawProjects(); tickClock();

function renderCanalChips(){

function sortList(list){list.sort((a,b)=>{if(pSort==="nome")return (a.nome||"").localeCompare(b.nome||"");if(pSort==="tempo")return projectTotal(b)-projectTotal(a);if(pSort==="tipo")return programaLabel(a).localeCompare(programaLabel(b));return (b.data||"").localeCompare(a.data||"");});}
function projMatch(p){return (pCanal==="Todos"||p.canal===pCanal)&&(pPrograma==="Todos"||p.programa===pPrograma)&&(pStatus==="todas"||(pStatus==="concluida"?projDone(p):!projDone(p)))&&(p.nome||"").toLowerCase().includes(pQuery.toLowerCase());}
function enterYear(y){pYear=y;pMonth=null;drawProjects();}
function enterMonth(m){pMonth=+m;drawProjects();}
function enterNoDate(){pYear='__nodate__';pMonth=null;drawProjects();}
function goYears(){pYear=null;pMonth=null;drawProjects();}
function goMonths(){pMonth=null;drawProjects();}
function folderRow(label,count,onclick){return `<div class="folder" onclick="${onclick}"><div class="fdr-ic">📁</div><div class="fdr-t">${esc(label)}</div><div class="fdr-c">${count} projeto(s)</div><div class="fdr-arrow">›</div></div>`;}
function projectCard(p){return `<div class="card hoverable" onclick="openProject('${p.id}')">
    <div class="row between"><div><div class="big" style="font-size:16px">${esc(p.nome)}</div><div class="muted">${esc(canalLabel(p))} · ${p.data?fmtDateBR(p.data):'Sem data'}</div></div><span class="pill ${programaClass(p.programa)}">${esc(programaLabel(p))}</span></div>
    <div class="row between" style="margin-top:16px"><span class="muted">Tempo total</span><span class="kpi mono">${fmt(projectTotal(p))}</span></div>
    <div class="muted" style="margin-top:10px">Checklist · ${checklistPct(p)}%</div><div class="bar"><i style="width:${checklistPct(p)}%"></i></div>
    <div class="row" style="margin-top:14px;gap:6px">${statusSelo(p)}<span class="pill">${p.timers.length} cron.</span><button class="mini" style="margin-left:auto" title="Excluir projeto" onclick="event.stopPropagation();delProject('${p.id}')">🗑</button></div>
  </div>`;}
function projectRow(p){return `<div class="prow" onclick="openProject('${p.id}')">
    <div class="prow-main"><div class="prow-name">${esc(p.nome)}</div><div class="muted prow-sub">${esc(canalLabel(p))} · ${esc(programaLabel(p))} · ${p.data?fmtDateBR(p.data):'Sem data'}</div></div>
    <div class="prow-meta mono">${fmt(projectTotal(p))}</div><div class="prow-meta">${checklistPct(p)}%</div><div class="prow-meta">${statusSelo(p)}</div>
    <button class="mini" title="Excluir" onclick="event.stopPropagation();delProject('${p.id}')">🗑</button></div>`;}
function renderList(list){const grid=$("#pGrid");$("#pEmpty").style.display=list.length?'none':'block';if(pView==='lista'){grid.className='plist';grid.innerHTML=list.map(projectRow).join("");}else{grid.className='grid g3';grid.innerHTML=list.map(projectCard).join("");}}
function drawProjects(){
  const grid=$("#pGrid");if(!grid)return;const crumb=$("#pCrumb");
  const filtering = pQuery.trim()!=='' || pCanal!=="Todos" || pPrograma!=="Todos" || pStatus!=="todas";
  const all=DB.projects.filter(projMatch);
  if(filtering){crumb.innerHTML='';const list=all.slice();sortList(list);renderList(list);return;}
  if(pYear==='__nodate__'){crumb.innerHTML=`<a onclick="goYears()">Projetos</a> <span class="sep">›</span> <span>Sem data</span>`;const list=all.filter(p=>!projYear(p));sortList(list);renderList(list);return;}
  if(pYear&&pMonth!=null){crumb.innerHTML=`<a onclick="goYears()">Projetos</a> <span class="sep">›</span> <a onclick="goMonths()">${pYear}</a> <span class="sep">›</span> <span>${MESES[pMonth]}</span>`;const list=all.filter(p=>projYear(p)===pYear&&projMonth(p)===pMonth);sortList(list);renderList(list);return;}
  if(pYear){crumb.innerHTML=`<a onclick="goYears()">Projetos</a> <span class="sep">›</span> <span>${pYear}</span>`;const months={};all.forEach(p=>{if(projYear(p)===pYear){const m=projMonth(p);if(m!=null)months[m]=(months[m]||0)+1;}});const keys=Object.keys(months).map(Number).sort((a,b)=>b-a);grid.className='';grid.innerHTML=keys.length?keys.map(m=>folderRow(MESES[m],months[m],`enterMonth(${m})`)).join(""):'<div class="muted">Nenhum projeto neste ano.</div>';$("#pEmpty").style.display='none';return;}
  crumb.innerHTML=`<span>Projetos</span>`;
  const years={};let noDate=0;all.forEach(p=>{const y=projYear(p);if(y)years[y]=(years[y]||0)+1;else noDate++;});
  const keys=Object.keys(years).sort((a,b)=>b.localeCompare(a));
  grid.className='';let h=keys.map(y=>folderRow(y,years[y],`enterYear('${y}')`)).join("");if(noDate)h+=folderRow('Sem data',noDate,`enterNoDate()`);
  grid.innerHTML=h;$("#pEmpty").style.display=(keys.length||noDate)?'none':'block';
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function canalLabel(p){return (p.canalTxt||p.canal||'').trim();}
function programaLabel(p){return (p.programaTxt||p.programa||'').trim();}
function projectFormHTML(p){
  const today=new Date().toISOString().slice(0,10);p=p||{};
  const canais=Object.keys(CATEGORIES);const curCanal=p.canal||canais[0];
  return `<h3>${p.id?'Editar projeto':'Novo projeto'}</h3><div class="muted">Preencha os dados. Dá pra guardar vários links (Drive, roteiro, bruto...).</div>
    <div class="frow" style="margin-top:8px">
      <div class="field"><label>Nome</label><input class="inp" id="npNome" placeholder="Ex: Giro da Bolsa 14-09" value="${esc(p.nome||'')}"></div>
      <div class="field"><label>Editor</label><input class="inp" id="npEditor" value="${esc(p.editor!=null?p.editor:DB.profile.name)}"></div>
      <div class="field"><label>Data</label><input class="inp" id="npData" type="date" value="${esc(p.data!=null?p.data:today)}"></div>
      <div class="field"><label>Canal / Categoria</label><select class="inp" id="npCanal" onchange="npUpdatePrograma()">${canais.map(c=>`<option ${c===curCanal?'selected':''}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field" id="npCanalTxtWrap" style="display:none"><label>Descreva (o que é?)</label><input class="inp" id="npCanalTxt" placeholder="Ex: Reunião, Treinamento, Arte" value="${esc(p.canalTxt||'')}"></div>
      <div class="field"><label>Programa</label><select class="inp" id="npPrograma"></select></div>
      <div class="field" id="npProgramaTxtWrap" style="display:none"><label>Descreva o programa</label><input class="inp" id="npProgramaTxt" placeholder="Ex: Institucional" value="${esc(p.programaTxt||'')}"></div>
      <div class="field"><label>Fluxo</label><select class="inp" id="npFluxo"><option>Padrão</option><option>Urgente</option></select></div>
      <div class="field" id="npBrutoWrap"><label>Tempo do bruto (hh:mm)<span id="npBrutoReq" style="color:var(--red)"> *</span></label><input class="inp" id="npBruto" placeholder="ex: 01:30" inputmode="numeric" value="${esc(p.bruto||'')}" oninput="maskHM(this)"></div>
      <div class="field"><label>Link da pasta no Drive</label><div class="row" style="gap:6px"><input class="inp" id="npDrive" placeholder="https://drive.google.com/..." value="${esc(p.drive||'')}"><button class="btn ghost sm" title="Adicionar outro link" onclick="addLinkRow()">＋</button></div></div>
    </div>
    <div id="npLinks"></div>
    <div class="field"><label>Observações</label><textarea class="inp" id="npObs" placeholder="opcional" style="min-height:60px">${esc(p.obs||'')}</textarea></div>
    <div class="muted" id="npGavetaNote" style="margin-top:8px;display:none">Gaveta: a data pode ficar em branco (sem data de saída). Você define depois ao publicar.</div>
    <div class="row" style="gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn gold" onclick="saveProjectForm(${p.id?`'${p.id}'`:'null'})">${p.id?'Salvar':'Criar projeto'}</button></div>`;
}
function newProjectModal(){$("#modalBody").innerHTML=projectFormHTML(null);$("#npFluxo").value=DB.prefs.defaultFlow||"Padrão";npUpdatePrograma();openModal();}
function editProject(id){const p=getProject(id);if(!p)return;$("#modalBody").innerHTML=projectFormHTML(p);$("#npFluxo").value=p.fluxo||"Padrão";npUpdatePrograma(p.programa);(p.links||[]).forEach(l=>addLinkRow(l.label,l.url));openModal();}
function npUpdatePrograma(preselect){const canal=$("#npCanal").value;const sel=$("#npPrograma");sel.innerHTML=(CATEGORIES[canal]||[]).map(pr=>`<option ${pr===preselect?'selected':''}>${esc(pr)}</option>`).join("");const cw=$("#npCanalTxtWrap");if(cw)cw.style.display=(canal==='Interno / Outro')?'block':'none';const req=$("#npBrutoReq");if(req)req.style.display=isVideoCanal(canal)?'inline':'none';npToggleProg();sel.onchange=npToggleProg;}
function npToggleProg(){const pr=$("#npPrograma").value;const pw=$("#npProgramaTxtWrap");if(pw)pw.style.display=(pr==='Interno'||pr==='Outro')?'block':'none';const n=$("#npGavetaNote");if(n)n.style.display=(pr==='Gaveta')?'block':'none';}
function addLinkRow(label,url){const box=$("#npLinks");if(!box)return;const div=document.createElement('div');div.className='row link-row';div.style.gap='6px';div.style.marginTop='8px';div.innerHTML=`<input class="inp lk-label" placeholder="Nome (ex: Roteiro)" value="${esc(label||'')}" style="max-width:190px"><input class="inp lk-url" placeholder="https://..." value="${esc(url||'')}"><button class="btn ghost sm" title="Remover" onclick="this.parentNode.remove()">✕</button>`;box.appendChild(div);}
function collectLinks(){return $$("#npLinks .link-row").map(r=>({label:r.querySelector('.lk-label').value.trim(),url:r.querySelector('.lk-url').value.trim()})).filter(l=>l.url);}
const DEFAULT_TIMERS=["Criação de inserções","Edição","Espera para revisão","Revisão","Alterações","Exportação"];
function makeDefaultTimers(){return DEFAULT_TIMERS.map(n=>({id:uid(),name:n,status:'idle',segs:[],manual:0,startedAt:null,startClock:null,endClock:null,comments:[],history:[]}));}
function maskHM(el){let d=(el.value||'').replace(/\D/g,'').slice(0,4);if(d.length>=3)d=d.slice(0,d.length-2)+':'+d.slice(-2);el.value=d;}
function validHM(v){return /^\d{1,2}:\d{2}$/.test(v)&&(+v.split(':')[1]<60);}
function saveProjectForm(id){
  const nome=$("#npNome").value.trim()||"(sem nome)";
  const canal=$("#npCanal").value;const canalTxt=(canal==='Interno / Outro')?$("#npCanalTxt").value.trim():'';
  const programa=$("#npPrograma").value;const programaTxt=(programa==='Interno'||programa==='Outro')?$("#npProgramaTxt").value.trim():'';
  const bruto=$("#npBruto").value.trim();
  if(isVideoCanal(canal)&&!bruto){toast("Informe o tempo do bruto (hh:mm) para projetos de vídeo.");$("#npBruto").focus();return;}
  if(bruto&&!validHM(bruto)){toast("Tempo do bruto inválido. Use o formato hh:mm (ex: 01:30).");$("#npBruto").focus();return;}
  const data=$("#npData").value||(programa==='Gaveta'?'':new Date().toISOString().slice(0,10));
  const base={nome,editor:$("#npEditor").value.trim(),data,canal,canalTxt,programa,programaTxt,bruto,fluxo:$("#npFluxo").value,drive:$("#npDrive").value.trim(),links:collectLinks(),obs:$("#npObs").value.trim()};
  if(id){const p=getProject(id);if(p){Object.assign(p,base);save();closeModal();openProject(id);toast("Projeto atualizado.");}}
  else{const p=Object.assign({id:uid(),status:"em edição",done:false,createdAt:Date.now(),timers:makeDefaultTimers(),checklist:emptyChecklist()},base);DB.projects.unshift(p);save();closeModal();openProject(p.id);toast("Projeto criado.");}
}

/* ============================ PROJETO ABERTO ============================ */
function getProject(id){return DB.projects.find(p=>p.id===id);}
function openProject(id){openProjectId=id;current='projeto';$$('.screen').forEach(x=>x.classList.toggle('active',x.id==='s-projeto'));$$('#tabs button').forEach(b=>b.classList.remove('active'));$("#fab").classList.remove('show');renderProjeto();window.scrollTo({top:0,behavior:'smooth'});}
function renderProjeto(){
  const p=getProject(openProjectId);if(!p){go('projetos');return;}
  const tipoClass=programaClass(p.programa);
  const running=p.timers.find(t=>t.status==='running');
  $("#s-projeto").innerHTML=`
    <div class="proj-wrap ${chatOpen?'':'chat-closed'}" id="projWrap"><div class="proj-main">
    <div class="row between wrapf">
      <div><div class="row" style="gap:10px"><button class="btn ghost sm" onclick="go('projetos')">← Projetos</button><h1 style="font-size:23px">${esc(p.nome)}</h1><span class="pill">${esc(canalLabel(p))}</span><span class="pill ${tipoClass}">${esc(programaLabel(p))}</span>${statusSelo(p)}</div>
      <div class="sub">${p.data?fmtDateBR(p.data):'Sem data'} · Editor: ${esc(p.editor||'—')}${p.bruto?' · Bruto: '+esc(p.bruto):''}${p.projStart?' · <b>Início:</b> '+fmtDT(p.projStart):''}${p.doneAt&&projDone(p)?' · <b>Concluído:</b> '+fmtDT(p.doneAt):''}</div></div>
      <div class="row wrapf" style="gap:8px">${p.drive?`<button class="btn ghost sm" onclick="openLink('${encodeURI(p.drive)}')">📁 Abrir Drive</button>`:''}${(p.links||[]).map(l=>`<button class="btn ghost sm" onclick="openLink('${encodeURI(l.url)}')">🔗 ${esc(l.label||'Link')}</button>`).join("")}<button class="btn ${projDone(p)?'ghost':'gold'} sm" onclick="toggleDone('${p.id}')">${projDone(p)?'↩ Reabrir':'✅ Concluir'}</button><button class="btn ghost sm" onclick="toggleChat()">💬 Chat</button><button class="btn ghost sm" onclick="editProject('${p.id}')">✎ Editar</button><button class="btn ghost sm" onclick="delProject('${p.id}')">🗑 Excluir</button></div>
    </div>
    <div class="grid g4" style="margin-top:20px">
      <div class="card"><div class="muted">Tempo total</div><div class="kpi mono" id="pTotal" style="margin-top:4px">${fmt(projectTotal(p))}</div></div>
      <div class="card"><div class="muted">Cronômetros</div><div class="kpi" style="margin-top:4px">${p.timers.filter(t=>t.status==='done').length} / ${p.timers.length}</div></div>
      <div class="card"><div class="muted">Em andamento</div><div class="kpi" style="margin-top:4px">${running?`<span class="dot"></span>${esc(running.name)}`:'—'}</div></div>
      <div class="card"><div class="muted">Checklist</div><div class="kpi" style="margin-top:4px">${checklistPct(p)}%</div></div>
    </div>
    <h3 style="margin:24px 0 12px;font-size:16px">Cronômetros do processo</h3>
    <div id="timers"></div>
    <div class="new-form" id="newForm" style="display:none">
      <div class="row wrapf" style="gap:12px;align-items:flex-end">
        <div class="field" style="flex:1;min-width:200px;margin:0"><label>Processo (escolha ou escreva o seu)</label><input class="inp" id="ntName" list="procs" placeholder="Ex: Decupagem"><datalist id="procs">${DB.prefs.processes.map(x=>`<option>${esc(x)}</option>`).join("")}</datalist></div>
        <button class="btn gold" onclick="createTimer()">Criar cronômetro</button><button class="btn ghost" onclick="toggleNewForm(false)">Cancelar</button>
      </div>
    </div>
    <div class="new-timer" id="newBtn" onclick="toggleNewForm(true)">＋ Novo cronômetro</div>
    ${checklistPct(p)===100&&!projDone(p)?`<div class="bridge" style="border-color:var(--green)"><div><div class="big">Tudo checado! 🎉</div><div class="muted">O checklist chegou a 100%. Quer marcar este projeto como concluído?</div></div><button class="btn gold" onclick="toggleDone('${p.id}')">✅ Marcar como concluída</button></div>`:''}
    <div class="card destaque compact" onclick="insClick()" style="margin-bottom:16px"></div>
    <div class="bridge"><div><div class="big">Etapas concluídas? Passe para a verificação final.</div><div class="muted">O tempo de cada etapa entra no relatório junto com o checklist.</div></div><button class="btn gold" onclick="openChecklist('${p.id}')">→ Próximo passo: Checklist</button></div>
    </div>
    <aside class="proj-chat ${chatOpen?'open':''}" id="projChat">
      <div class="pc-head"><b>💬 Chat do projeto</b><button class="mini" onclick="toggleChat()" title="Fechar">✕</button></div>
      <div class="pc-list" id="chatList"></div>
      <div class="pc-input"><input class="inp" id="chatIn" placeholder="Comentar no projeto..." onkeydown="if(event.key==='Enter')sendChat()"><button class="btn gold sm" onclick="sendChat()">Enviar</button></div>
    </aside></div>
    <button class="chat-fab" onclick="toggleChat()" title="Chat">💬</button>`;
  renderTimers();renderChat();startDestaques();
}
let chatOpen=(window.innerWidth>900);
function toggleChat(){chatOpen=!chatOpen;const w=$("#projWrap"),c=$("#projChat");if(w)w.classList.toggle('chat-closed',!chatOpen);if(c)c.classList.toggle('open',chatOpen);if(chatOpen)renderChat();}
function avatarHTML(){const ph=DB.profile.photo;const ini=(DB.profile.name||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();return `<div class="msg-av">${ph?`<img src="${ph}" alt="">`:esc(ini)}</div>`;}
function projChatMessages(){const p=getProject(openProjectId);if(!p)return[];const msgs=[];
  p.timers.forEach(t=>(t.comments||[]).forEach(c=>msgs.push({text:c.text,at:c.at,ts:c.ts||0,timerId:t.id,timerName:t.name})));
  (p.chat||[]).forEach(c=>msgs.push({text:c.text,at:c.at,ts:c.ts||0,general:true}));
  msgs.sort((a,b)=>(a.ts||0)-(b.ts||0));return msgs;}
function renderChat(){const box=$("#chatList");if(!box)return;const msgs=projChatMessages();
  box.innerHTML=msgs.length?msgs.map(m=>`<div class="msg">${avatarHTML()}<div class="msg-b"><div class="msg-top"><b>${esc(DB.profile.name||'Você')}</b><span class="msg-time">${esc(m.at||'')}</span></div>${m.timerName?`<span class="msg-tag" onclick="jumpToTimer('${m.timerId}')">⏱ ${esc(m.timerName)}</span>`:''}<div class="msg-txt">${esc(m.text)}</div></div></div>`).join(""):'<div class="muted">Nenhum comentário ainda. Comente aqui ou dentro de um cronômetro.</div>';
  box.scrollTop=box.scrollHeight;}
function sendChat(){const inp=$("#chatIn");const txt=(inp.value||'').trim();if(!txt)return;const p=getProject(openProjectId);p.chat=p.chat||[];p.chat.push({text:txt,at:nowClock(),ts:Date.now()});save();inp.value='';renderChat();}
function jumpToTimer(id){const t=getTimer(id);if(t&&!t._open){t._open=true;renderTimers();}const el=document.querySelector('.timer[data-tid="'+id+'"]');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('blink');void el.offsetWidth;el.classList.add('blink');setTimeout(()=>el.classList.remove('blink'),1800);}}
function toggleNewForm(show){const f=$("#newForm"),b=$("#newBtn");if(!f)return;f.style.display=show?'block':'none';b.style.display=show?'none':'block';if(show){const i=$("#ntName");i.value=DB.prefs.processes[0]||"";i.focus();i.select();}}
function createTimer(){const p=getProject(openProjectId);const name=$("#ntName").value.trim()||"Novo processo";p.timers.push({id:uid(),name,status:'idle',segs:[],manual:0,startedAt:null,startClock:null,endClock:null,comments:[],history:[]});save();toggleNewForm(false);renderTimers();updateProjectKpis();toast("Cronômetro criado.");}
function renderTimers(){
  const p=getProject(openProjectId);const box=$("#timers");if(!box)return;
  const stMap={idle:['não iniciado',''],running:['em andamento','g'],paused:['pausado','gold'],done:['concluído','g']};
  box.innerHTML=p.timers.map(t=>{
    const st=stMap[t.status]||stMap.idle;const open=t._open?'open':'';const run=t.status==='running'?'run':'';
    const timeCls=t.status==='running'?'t-time run mono':'t-time mono';
    const dot=t.status==='running'?'<span class="dot"></span>':'';
    return `<div class="timer ${run} ${open}" data-tid="${t.id}">
      <div class="t-head" onclick="toggleTimer('${t.id}')">
        <div class="t-ic">⏱</div>
        <div class="t-name">${esc(t.name)} <span class="pencil" onclick="renameTimer(event,'${t.id}')">✎</span></div>
        <div class="${timeCls}" data-elapsed="${t.id}">${dot}${fmt(elapsed(t))}</div>
        <span class="pill ${st[1]}">${st[0]}</span>
        <button class="hbtn" onclick="event.stopPropagation();${t.status==='running'?`pauseTimer('${t.id}')`:`startTimer('${t.id}')`}" title="${t.status==='running'?'Pausar':'Iniciar'}">${t.status==='running'?'⏸':'▶'}</button>
        <span class="chev">▾</span>
      </div>
      <div class="t-body">
        <div class="t-controls">
          ${t.status==='running'?`<button class="cbtn pause" onclick="pauseTimer('${t.id}')">⏸ Pausar</button>`:`<button class="cbtn play" onclick="startTimer('${t.id}')">▶ ${t.status==='paused'?'Retomar':'Iniciar'}</button>`}
          <button class="cbtn stop" onclick="stopTimer('${t.id}')">⏹ Parar</button>
          <button class="icon-btn" onclick="toggleEditTime('${t.id}')">✎ Editar tempo</button>
          <button class="icon-btn" onclick="addTimePrompt('${t.id}')">＋ Somar tempo</button>
          <button class="icon-btn" onclick="wipeTime('${t.id}')">🧹 Zerar tempo</button>
          <button class="icon-btn" onclick="deleteTimer('${t.id}')">🗑 Excluir</button>
        </div>
        <div class="edit-time" id="edit-${t.id}">
          <label>Definir tempo total (manual)</label>
          <div class="row" style="gap:6px;margin-top:6px;align-items:center"><input class="tt-in" id="eh-${t.id}"><span>:</span><input class="tt-in" id="em-${t.id}"><span>:</span><input class="tt-in" id="es-${t.id}"><button class="btn gold sm" onclick="saveEditTime('${t.id}')">Salvar</button><button class="btn ghost sm" onclick="toggleEditTime('${t.id}')">Cancelar</button></div>
          <div class="muted" style="margin-top:6px">Digite o tempo à mão — igual ao ClickUp. Toda alteração fica no histórico.</div>
        </div>
        <div class="t-meta">
          <button class="icon-btn" onclick="openComments('${t.id}')">💬 Comentários (${t.comments.length})</button>
          <button class="icon-btn" onclick="openHistory('${t.id}')">🕘 Histórico</button>
          <span class="muted">${t.startClock?'início '+t.startClock:''}${t.endClock?' · fim '+t.endClock:''}${t.status==='running'?' · contando (segue mesmo se fechar)':''}</span>
        </div>
      </div></div>`;
  }).join("")|| `<div class="muted" style="padding:8px 2px">Nenhum cronômetro ainda. Crie o primeiro abaixo.</div>`;
}
function getTimer(id){const p=getProject(openProjectId);return p.timers.find(t=>t.id===id);}
function toggleTimer(id){const t=getTimer(id);t._open=!t._open;renderTimers();}
function tHist(t,txt){t.history.push({at:new Date().toLocaleString('pt-BR'),text:txt});}
function startTimer(id){const t=getTimer(id);if(t.status==='running')return;t.status='running';t.startedAt=Date.now();if(!t.startClock)t.startClock=nowClock();const p=getProject(openProjectId);if(p&&!p.projStart)p.projStart=Date.now();tHist(t,'Cronômetro iniciado.');save();renderTimers();updateProjectKpis();refreshFab();}
function pauseTimer(id){const t=getTimer(id);if(t.status!=='running')return;t.segs=t.segs||[];if(t.startedAt)t.segs.push({s:t.startedAt,e:Date.now()});t.startedAt=null;t.status='paused';tHist(t,'Pausado.');save();renderTimers();updateProjectKpis();refreshFab();}
function stopTimer(id){const t=getTimer(id);t.segs=t.segs||[];if(t.status==='running'&&t.startedAt)t.segs.push({s:t.startedAt,e:Date.now()});t.startedAt=null;t.status='done';t.endClock=nowClock();tHist(t,'Finalizado. Total: '+fmt(elapsed(t)));save();renderTimers();updateProjectKpis();refreshFab();}
function renameTimer(ev,id){ev.stopPropagation();const t=getTimer(id);const n=prompt("Nome do processo:",t.name);if(n&&n.trim()){tHist(t,'Renomeado: "'+t.name+'" → "'+n.trim()+'".');t.name=n.trim();save();renderTimers();}}
function toggleEditTime(id){const el=$("#edit-"+id);const t=getTimer(id);if(!el)return;const show=el.style.display!=='block';el.style.display=show?'block':'none';if(show){const e=elapsed(t);$("#eh-"+id).value=pad(Math.floor(e/3600));$("#em-"+id).value=pad(Math.floor(e%3600/60));$("#es-"+id).value=pad(Math.floor(e%60));}}
function saveEditTime(id){const t=getTimer(id);const h=+($("#eh-"+id).value||0),m=+($("#em-"+id).value||0),s=+($("#es-"+id).value||0);const total=h*3600+m*60+s;const before=fmt(elapsed(t));t.segs=[];t.manual=total;if(t.status==='running')t.startedAt=Date.now();tHist(t,'Ajuste manual do total: '+before+' → '+fmt(total)+'.');save();renderTimers();updateProjectKpis();toast("Tempo ajustado.");}
function addTimePrompt(id){const t=getTimer(id);const v=prompt("Adicionar quantos minutos?","15");const min=parseFloat((v||"").replace(",","."));if(!min||min<=0)return;t.manual=(t.manual||0)+min*60;tHist(t,'Adicionou +'+min+' min manualmente.');save();renderTimers();updateProjectKpis();toast("+"+min+" min.");}
function wipeTime(id){const t=getTimer(id);confirmAction('Zerar o tempo deste cronômetro? A ação fica registrada no histórico.',()=>{const before=fmt(elapsed(t));t.segs=[];t.manual=0;if(t.status==='running')t.startedAt=Date.now();tHist(t,'Tempo zerado (era '+before+').');save();renderTimers();updateProjectKpis();toast("Tempo zerado.");});}
function deleteTimer(id){const t=getTimer(id);confirmAction('Excluir o cronômetro "'+(t?t.name:'')+'"? Ele vai para a lixeira e pode ser restaurado.',()=>{const p=getProject(openProjectId);p.timers=p.timers.filter(x=>x.id!==id);DB.trash.unshift({type:'timer',data:t,projectId:p.id,projectName:p.nome,at:Date.now()});save();renderTimers();updateProjectKpis();refreshFab();toast("Cronômetro na lixeira.");});}
function updateProjectKpis(){const p=getProject(openProjectId);if(!p||current!=='projeto')return;const tot=$("#pTotal");if(tot)tot.textContent=fmt(projectTotal(p));}

/* comentários e histórico (drawer) */
function openComments(id){const t=getTimer(id);
  $("#drawBody").innerHTML=`<h3 style="font-size:19px;font-weight:800">Comentários — ${esc(t.name)}</h3><div class="muted" style="margin:4px 0 16px">Cada comentário guarda o minuto do processo.</div>
  <div id="cmtList">${t.comments.map(c=>`<div class="cmt"><div class="h"><span class="stamp">${c.min}</span> ${esc(DB.profile.name)} · ${c.at}</div><div class="t">${esc(c.text)}</div></div>`).join("")||'<div class="muted">Nenhum comentário ainda.</div>'}</div>
  <div class="field" style="margin-top:16px"><label>Novo comentário (marca o minuto atual)</label><input class="inp" id="cmtIn" placeholder="Escreva um detalhe..."></div>
  <button class="btn gold sm" style="margin-top:10px;width:100%;justify-content:center" onclick="addComment('${id}')">Adicionar comentário</button>`;
  openDraw();setTimeout(()=>{const i=$("#cmtIn");i&&i.focus();},50);
}

function avExpirado(av){return av.tipo==='unica'&&av.data&&av.data<new Date().toISOString().slice(0,10);}
function diasParaAviso(av){const now=new Date();const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();const base=new Date(y,m,d);
  if(av.tipo==='diario')return 0;
  if(av.tipo==='unica'){if(!av.data)return null;const dt=new Date(av.data+'T00:00:00');return Math.round((dt-base)/864e5);}
  if(av.tipo==='mensal'){let alvo=new Date(y,m,av.dia);if(av.dia<d)alvo=new Date(y,m+1,av.dia);return Math.round((alvo-base)/864e5);}
  if(av.tipo==='semanal'){return (av.diaSemana-now.getDay()+7)%7;}
  return null;}

function marcosInsights(){
  const arr=[];const now=Date.now();const day=864e5;
  const done=DB.projects.filter(p=>projDone(p)&&p.doneAt);
  const inRange=(ms)=>done.filter(p=>p.doneAt>=now-ms).length;

  if(sem)arr.push({ic:'📅',t:'Marco da semana',x:`${sem} projeto(s) concluído(s) nos últimos 7 dias.`});
  if(mes)arr.push({ic:'🗓️',t:'Marco do mês',x:`${mes} projeto(s) fechado(s) no último mês. Consistência é tudo.`});
  if(ano)arr.push({ic:'🏆',t:'Marco do ano',x:`${ano} projeto(s) concluído(s) nos últimos 12 meses. Que jornada!`});

function buildInsights(){
  const arr=[];const withTime=DB.projects.filter(p=>projectTotal(p)>0);const done=DB.projects.filter(p=>projDone(p));
  if(withTime.length){
    const fast=withTime.slice().sort((a,b)=>projectTotal(a)-projectTotal(b))[0];
    arr.push({ic:'⚡',t:'Edição mais rápida',x:`"${fast.nome}" saiu em ${_short(projectTotal(fast))}. Belo ritmo!`,pid:fast.id});
    const big=withTime.slice().sort((a,b)=>projectTotal(b)-projectTotal(a))[0];
    if(big.id!==fast.id)arr.push({ic:'🏋️',t:'Projeto mais robusto',x:`"${big.nome}" foi o que mais exigiu: ${_short(projectTotal(big))} de trabalho.`,pid:big.id});
  }
  if(done.length){
    arr.push({ic:'✅',t:'Entregas no período',x:`Você já concluiu ${done.length} projeto(s). Cada entrega conta!`});

  if(tDone)arr.push({ic:'📌',t:'Tarefas em dia',x:`${tDone} tarefa(s) concluída(s). Organização em alta.`});

let _avisoTimer=null,_avisoParado={};
function checkAvisoDoDia(){

  (DB.avisos||[]).forEach(av=>{ if(av.ativo&&avisoHoje(av)&&_avisoParado[av.id]!==hojeStr){ /* elegível */ } });

function avToggleTipo(){const t=$("#avTipo").value;$("#avDiaWrap").style.display=t==='mensal'?'block':'none';$("#avSemWrap").style.display=t==='semanal'?'block':'none';$("#avCalWrap").style.display=t==='unica'?'block':'none';if(t==='unica'){_avCalY=new Date().getFullYear();_avCalM=new Date().getMonth();avCalRender();}}
function avCalRender(){const wrap=$("#avCal");if(!wrap)return;const startDow=new Date(_avCalY,_avCalM,1).getDay();const days=new Date(_avCalY,_avCalM+1,0).getDate();const todayStr=new Date().toISOString().slice(0,10);let cells='';for(let i=0;i<startDow;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const ds=_avCalY+'-'+pad(_avCalM+1)+'-'+pad(d);cells+=`<div class="calday ${ds===_avSelDate?'sel':''} ${ds===todayStr?'today':''}" onclick="avPick('${ds}')">${d}</div>`;}wrap.innerHTML=`<div class="cal-head"><button type="button" class="mini" onclick="avCalNav(-1)">‹</button><b>${MESES[_avCalM]} ${_avCalY}</b><button type="button" class="mini" onclick="avCalNav(1)">›</button></div><div class="cal-dow">${['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-grid">${cells}</div>`;}

function toggleAviso(id){const av=DB.avisos.find(a=>a.id===id);if(!av)return;if(av.fixo){toast('Este aviso é obrigatório e não pode ser desativado.');renderAvList();return;}av.ativo=!av.ativo;save();renderAvList();}

function backupDownload(){

  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Relatorio</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>${h}</body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:"application/vnd.ms-excel"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="relatorio-central-do-editor-"+repPeriod+".xls";a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},1500);
  DB.savedReports.unshift({periodo:repPeriod,at:new Date().toLocaleString('pt-BR'),projetos:list.length,tempo:fmtShort(list.reduce((a,p)=>a+projectTotal(p),0))});save();
  toast("Planilha exportada (.xls).");
}

function pomoFmt(){const m=Math.floor(pomo.remaining/60),s=pomo.remaining%60;return pad(m)+":"+pad(s);}
function updatePomoSeg(){$$("#pomoSeg button").forEach(b=>b.classList.toggle('on',b.dataset.m===pomo.mode));}
function renderCyc(){const c=$("#pomoCyc");if(c)c.innerHTML=[0,1,2,3].map(i=>`<i class="${i<pomo.cycles%4?'on':''}"></i>`).join("");const t=$("#pomoCycTxt");if(t)t.textContent=pomo.cycles+' ciclo(s) de foco hoje';}
function pomoRingUpdate(){const fg=$("#pringFg");if(!fg)return;const C=2*Math.PI*54;const total=POMO_MIN[pomo.mode]*60;const prog=Math.min(1,Math.max(0,1-pomo.remaining/total));fg.style.strokeDasharray=C.toFixed(1);fg.style.strokeDashoffset=(C*(1-prog)).toFixed(1);fg.style.stroke=POMO_COL[pomo.mode];fg.style.color=POMO_COL[pomo.mode];const w=$("#pomoRing");if(w)w.classList.toggle('run',pomo.running);}
function showCat(cat){pomo._cat=cat;const box=$("#audioOptions");if(!box)return;const a=AUDIO[cat];box.style.display='block';box.innerHTML=`<div class="muted" style="margin-bottom:8px">${a.label} — escolha uma opção:</div><div class="chips">${a.opts.map((o,i)=>`<span class="chip" onclick="playOpt('${cat}',${i})">▶ ${esc(o.t)}</span>`).join("")}</div>`;}
function playOpt(cat,i){const o=AUDIO[cat].opts[i];const label=AUDIO[cat].label+' · '+o.t;if(o.yt)playYouTube(o.yt,label);else playEmbed(o.url,label);}
function pomoSetMode(m){pomo.mode=m;pomo.remaining=POMO_MIN[m]*60;pomo.running=false;clearInterval(pomo.timer);updatePomoSeg();$("#pomoT").textContent=pomoFmt();$("#pomoLbl").textContent=POMO_LABEL[m];$("#pomoStart").textContent='▶ Iniciar';pomoRingUpdate();}
function pomoToggle(){pomo.running=!pomo.running;$("#pomoStart").textContent=pomo.running?'⏸ Pausar':'▶ Iniciar';pomoRingUpdate();
  if(pomo.running){pomo.timer=setInterval(()=>{pomo.remaining--;const el=$("#pomoT");if(el)el.textContent=pomoFmt();pomoRingUpdate();if(pomo.remaining<=0){clearInterval(pomo.timer);pomo.running=false;if(pomo.mode==='foco')pomo.cycles++;renderCyc();pomoRingUpdate();const s=$("#pomoStart");if(s)s.textContent='▶ Iniciar';beep();toast("Pomodoro concluído!");}},1000);}else clearInterval(pomo.timer);}
function pomoReset(){clearInterval(pomo.timer);pomo.running=false;pomo.remaining=POMO_MIN[pomo.mode]*60;const el=$("#pomoT");if(el)el.textContent=pomoFmt();const s=$("#pomoStart");if(s)s.textContent='▶ Iniciar';pomoRingUpdate();}

let vol=60,ytPlayer=null,ytReady=false,pendingYT=null,dockKind=null,shuffleOn=false,repeatOn=false;
function dockActive(on){const d=$("#playerDock");if(d)d.classList.toggle('active',on);}
function setStage(kind,url){const st=$("#pdStage");if(!st)return;st.classList.toggle('embed',kind==='embed');st.classList.toggle('spbig',kind==='embed'&&/open\.spotify\.com\/embed\/(playlist|album)/.test(url||''));
  $("#pdCtrls").style.display=(kind==='yt')?'flex':'none';$("#pdVolRow").style.display=(kind==='yt')?'flex':'none';}
function loadYTApi(cb){if(window.YT&&window.YT.Player){cb();return;}window.onYouTubeIframeAPIReady=cb;if(!document.getElementById('ytapi')){const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';document.body.appendChild(s);}}
function ytEnsure(cb){if(ytReady&&ytPlayer){cb();return;}loadYTApi(()=>{if(!ytPlayer){ytPlayer=new YT.Player('ytHost',{playerVars:{autoplay:1,rel:0,playsinline:1},events:{onReady:()=>{ytReady=true;ytPlayer.setVolume(vol);cb();},onStateChange:e=>{const b=$("#pdPlay");if(b)b.textContent=(e.data===1)?'⏸':'▶';}}});}else{cb();}});}
function playYouTube(spec,label){$("#pdFrame").src='';dockKind='yt';$("#pdTitle").textContent=label||'YouTube';setStage('yt');dockActive(true);positionDock();
  ytEnsure(()=>{try{if(spec.list){ytPlayer.loadPlaylist({list:spec.list,listType:'playlist'});if(shuffleOn)ytPlayer.setShuffle(true);ytPlayer.setLoop(repeatOn);}else{ytPlayer.loadVideoById(spec.id);}ytPlayer.setVolume(vol);}catch(e){}});}
function playEmbed(url,label){try{ytPlayer&&ytReady&&ytPlayer.stopVideo();}catch(e){}dockKind='embed';$("#pdTitle").textContent=label||'';setStage('embed',url);dockActive(true);positionDock();if($("#pdFrame").src!==url)$("#pdFrame").src=url;}
function stopAudio(){dockActive(false);dockKind=null;try{ytPlayer&&ytReady&&ytPlayer.stopVideo();}catch(e){}const f=$("#pdFrame");if(f)f.src='';}
function setVol(v){vol=+v;try{ytPlayer&&ytReady&&ytPlayer.setVolume(vol);}catch(e){}}
function ytToggle(){try{if(!ytPlayer||!ytReady)return;const st=ytPlayer.getPlayerState();if(st===1)ytPlayer.pauseVideo();else ytPlayer.playVideo();}catch(e){}}
function ytPrev(){try{ytPlayer&&ytPlayer.previousVideo();}catch(e){}}
function ytNext(){try{ytPlayer&&ytPlayer.nextVideo();}catch(e){}}
function ytShuffle(){shuffleOn=!shuffleOn;const b=$("#pdShuf");if(b)b.classList.toggle('on',shuffleOn);try{ytPlayer&&ytPlayer.setShuffle&&ytPlayer.setShuffle(shuffleOn);if(shuffleOn&&ytPlayer.nextVideo)ytPlayer.nextVideo();}catch(e){}toast(shuffleOn?'Aleatório ligado':'Aleatório desligado');}
function ytRepeat(){repeatOn=!repeatOn;const b=$("#pdRep");if(b)b.classList.toggle('on',repeatOn);try{ytPlayer&&ytPlayer.setLoop&&ytPlayer.setLoop(repeatOn);}catch(e){}toast(repeatOn?'Repetir ligado':'Repetir desligado');}
async function pipToggle(){
  try{
    if(window.documentPictureInPicture){
      if(documentPictureInPicture.window){documentPictureInPicture.window.close();return;}
      const pw=await documentPictureInPicture.requestWindow({width:400,height:300});
      const dock=$("#playerDock");const home=document.getElementById('pipHome')||(()=>{const d=document.createElement('div');d.id='pipHome';d.style.display='none';document.body.appendChild(d);return d;})();
      pw.document.body.style.margin='0';pw.document.body.style.background='#000';pw.document.body.appendChild(dock);
      pw.addEventListener('pagehide',()=>{document.body.appendChild(dock);positionDock();});
      return;
    }
    toast('Seu navegador não tem Picture-in-Picture de janela. Use a telinha do canto ou o botão de PiP do próprio YouTube.');
  }catch(e){toast('Não consegui abrir o Picture-in-Picture.');}
}
function positionDock(){const d=$("#playerDock");if(!d)return;if(!d.classList.contains('active')){return;}
  if(documentPictureInPicture&&documentPictureInPicture.window){return;}
  const slot=(current==='pomodoro')?$("#playerSlot"):null;
  if(slot){slot.classList.add('on');const r=slot.getBoundingClientRect();d.classList.add('inpage');d.classList.remove('mini');d.style.position='absolute';d.style.left=(r.left+window.scrollX)+'px';d.style.top=(r.top+window.scrollY)+'px';d.style.width=r.width+'px';d.style.right='';d.style.bottom='';slot.style.height=d.offsetHeight+'px';}
  else{d.classList.add('mini');d.classList.remove('inpage');d.style.position='';d.style.left='';d.style.top='';d.style.width='';d.style.right='';d.style.bottom='';const s=$("#playerSlot");if(s){s.classList.remove('on');s.style.height='';}}
}
window.addEventListener('resize',()=>{if(typeof positionDock==='function')positionDock();});
function playMyLink(){const v=($("#pomoLink").value||'').trim();if(!v){toast("Cole um link primeiro.");return;}const e=parseLink(v);if(e.type==='yt')playYouTube(e,e.title);else playEmbed(e.url,e.title);}
function parseLink(url){let m,list=null;const lm=url.match(/[?&]list=([\w-]+)/);if(lm)list=lm[1];
  if(m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/shorts\/)([\w-]{6,})/))return{type:'yt',id:m[1],list,title:list?'YouTube (playlist)':'YouTube'};
  if(list&&/youtube\.com|youtu\.be/.test(url))return{type:'yt',list,title:'YouTube (playlist)'};
  if(m=url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|playlist|album|episode|show)\/([\w]+)/))return{type:'embed',url:'https://open.spotify.com/embed/'+m[1]+'/'+m[2],title:'Spotify'};
  if(url.includes('soundcloud.com'))return{type:'embed',url:'https://w.soundcloud.com/player/?url='+encodeURIComponent(url)+'&auto_play=true',title:'SoundCloud'};
  return{type:'embed',url:url,title:'Seu link'};}
