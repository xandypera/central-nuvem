function setCustom(k,v){DB.prefs.customProfile=Object.assign({},CUSTOM_DEF,DB.prefs.customProfile||{});DB.prefs.customProfile[k]=v;DB.prefs.profile='custom';applyProfile('custom');save();checkContrast();}
function resetCustom(){DB.prefs.customProfile=Object.assign({},CUSTOM_DEF);applyProfile('custom');save();renderProfiles();}
function checkContrast(){const w=$("#contrastWarn");if(!w)return;const v=profileVars(DB.prefs.profile||'ambar');const cT=contrast(v['--ink'],v['--bg']),cH=contrast(v['--header-ink'],v['--headerbg']);let m=[];if(cT<4.5)m.push('texto × fundo baixo ('+cT.toFixed(1)+':1)');if(cH<3)m.push('menu × cabeçalho baixo');if(m.length){w.style.display='block';w.textContent='⚠ Contraste: '+m.join(' · ')+'. Considere ajustar para melhorar a leitura.';}else w.style.display='none';}
function renderProcChips(){const box=$("#procChips");if(!box)return;box.innerHTML=DB.prefs.processes.map((p,i)=>`<span class="chip on">${esc(p)} <span onclick="rmProc(${i})" style="cursor:pointer;opacity:.7">✕</span></span>`).join("")+`<span class="chip" onclick="addProc()">+ adicionar</span>`;}
function addProc(){const n=prompt("Nome do processo:");if(n&&n.trim()){DB.prefs.processes.push(n.trim());save();renderProcChips();}}
function rmProc(i){DB.prefs.processes.splice(i,1);save();renderProcChips();}
function renderFolders(){const box=$("#folders");if(!box)return;box.innerHTML=DB.reportFolders.map((f,i)=>`<div class="link-row"><input class="inp" value="${esc(f.label)}" onchange="DB.reportFolders[${i}].label=this.value;save()"><input class="inp" value="${esc(f.link)}" placeholder="Link da pasta..." onchange="DB.reportFolders[${i}].link=this.value;save()"><button class="btn ghost sm" onclick="openLink(DB.reportFolders[${i}].link)">Abrir</button></div>`).join("");}
function addFolder(){DB.reportFolders.push({label:"Novo mês",link:""});save();renderFolders();}
function saveProfile(){DB.profile.name=$("#cfgName").value;DB.profile.role=$("#cfgRole").value;DB.profile.email=$("#cfgMail").value;DB.profile.team=$("#cfgTeam").value;save();refreshProfile();toast("Perfil salvo.");}
function setFlow(f){DB.prefs.defaultFlow=f;save();$$("#flowSeg button").forEach((b,i)=>b.classList.toggle('on',(i===1)===(f==='Urgente')));}
function toggleBell(el){el.classList.toggle('on');DB.prefs.bell=el.classList.contains('on');save();}

/* ============================ PERFIL / TEMA / MENU ============================ */
function refreshProfile(){const pr=DB.profile;const av=pr.photo?`<img src="${esc(pr.photo)}">`:initials(pr.name);$("#avatar").innerHTML=av;$("#menuAv").innerHTML=av;$("#menuName").textContent=pr.name;$("#menuMail").textContent=pr.email||pr.team||"";}
function toggleMenu(force){const m=$("#userMenu");if(force===false)m.classList.remove('show');else m.classList.toggle('show');}
$("#avatar").onclick=e=>{e.stopPropagation();toggleMenu();};
$("#userMenu").onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>toggleMenu(false));
/* ---- perfis de cores ---- */
const PROFILES={
  ambar:{light:true,vars:{'--bg':'#F1EFE9','--surface':'#FFFFFF','--surface2':'#F6F4EE','--surface3':'#EDEAE2','--line':'#D9D5CC','--line2':'#CBC6BB','--ink':'#201F1B','--mut':'#77736B','--mut2':'#9a958b','--gold':'#E8A927','--gold-dim':'#F6E9C7','--gold-ink':'#8a6a12','--headerbg':'#171717','--header-ink':'#f4f2ee','--header-mut':'#a8a29a'}},
  coral:{light:true,vars:{'--bg':'#F2F3F5','--surface':'#FFFFFF','--surface2':'#F4F5F7','--surface3':'#EAECEF','--line':'#D8DBE0','--line2':'#c7cbd2','--ink':'#25272C','--mut':'#727984','--mut2':'#969ca6','--gold':'#EF604F','--gold-dim':'#FDE5E1','--gold-ink':'#b23b2e','--headerbg':'#191B20','--header-ink':'#f2f3f5','--header-mut':'#a2a7b0'}},
  violeta:{light:true,vars:{'--bg':'#F3F1F6','--surface':'#FFFFFF','--surface2':'#F5F3F8','--surface3':'#EBE8F0','--line':'#DDD9E5','--line2':'#cdc8d8','--ink':'#292630','--mut':'#787080','--mut2':'#9d95a6','--gold':'#7357E8','--gold-dim':'#E9E3FF','--gold-ink':'#5a3fd0','--headerbg':'#18171D','--header-ink':'#f3f1f6','--header-mut':'#a49caf'}},
  escuro:{light:false,vars:{'--bg':'#0b0c0f','--surface':'#131519','--surface2':'#191c22','--surface3':'#1f232b','--line':'#2a2f38','--line2':'#363c47','--ink':'#f3f4f6','--mut':'#9aa2ad','--mut2':'#6a7280','--gold':'#e2b23c','--gold-dim':'#463813','--gold-ink':'#f2d488','--headerbg':'#0b0c0f','--header-ink':'#f3f4f6','--header-mut':'#9aa2ad'}}
};
const PROFILE_LABELS={ambar:'Grafite + âmbar',coral:'Grafite + coral',violeta:'Grafite + violeta',escuro:'Escuro',custom:'Personalizado'};
const CUSTOM_DEF={accent:'#E8A927',header:'#171717',bg:'#F1EFE9',surface:'#FFFFFF',text:'#201F1B',mut:'#77736B',border:'#D9D5CC',danger:'#d84f4f'};
function hx(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function toHex(a){return'#'+a.map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=hx(a),B=hx(b);return toHex([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]);}
function lum(h){const c=hx(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function isLight(h){return lum(h)>.5;}
function contrast(a,b){const L1=lum(a),L2=lum(b),hi=Math.max(L1,L2),lo=Math.min(L1,L2);return(hi+.05)/(lo+.05);}
function customVars(c){c=Object.assign({},CUSTOM_DEF,c||{});return{'--bg':c.bg,'--surface':c.surface,'--surface2':mix(c.surface,c.bg,.5),'--surface3':mix(c.surface,c.bg,.2),'--line':c.border,'--line2':mix(c.border,c.text,.15),'--ink':c.text,'--mut':c.mut,'--mut2':mix(c.mut,c.bg,.3),'--gold':c.accent,'--gold-dim':mix(c.accent,'#ffffff',.8),'--gold-ink':mix(c.accent,'#000000',.35),'--headerbg':c.header,'--header-ink':isLight(c.header)?'#1b1b1b':'#f4f2ee','--header-mut':isLight(c.header)?'#5a5a5a':'#a8a29a','--red':c.danger};}
function profileVars(name){return name==='custom'?customVars(DB.prefs.customProfile):(PROFILES[name]||PROFILES.ambar).vars;}
function profileIsLight(name){return name==='custom'?isLight((DB.prefs.customProfile||CUSTOM_DEF).bg):(PROFILES[name]||PROFILES.ambar).light;}
function applyProfile(name){const vars=profileVars(name);const root=document.documentElement;Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));document.body.classList.toggle('light',profileIsLight(name));}
function setProfile(name){DB.prefs.profile=name;applyProfile(name);save();}
function cycleProfile(){const order=['ambar','coral','violeta','escuro'];let i=order.indexOf(DB.prefs.profile||'ambar');i=(i+1)%order.length;setProfile(order[i]);toast('Perfil: '+PROFILE_LABELS[order[i]]);}
/* confirmação dentro da página (substitui o confirm nativo) */
let _confirmCb=null;
function confirmAction(msg,onYes){_confirmCb=onYes;$("#modalBody").innerHTML=`<h3>Confirmar</h3><div class="muted" style="margin-top:6px">${esc(msg)}</div><div class="row" style="gap:8px;margin-top:18px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn gold" onclick="confirmYes()">Sim, continuar</button></div>`;openModal();}
function confirmYes(){closeModal();const cb=_confirmCb;_confirmCb=null;if(cb)cb();}

/* ============================ MODAL / DRAWER ============================ */
function openModal(){$("#mback").classList.add('show');}
function closeModal(){$("#mback").classList.remove('show');}
$("#mback").onclick=e=>{if(e.target.id==='mback')closeModal();};

/* ============================ FAB + TICK + SINO ============================ */
function anyRunning(){return DB.projects.some(p=>p.timers.some(t=>t.status==='running'));}
function runningList(){const r=[];DB.projects.forEach(p=>p.timers.forEach(t=>{if(t.status==='running')r.push({p,t});}));return r;}
function refreshFab(){const show=current!=='projeto'&&anyRunning();$("#fab").classList.toggle('show',show);}
$("#fabGo").onclick=()=>{const r=runningList()[0];if(r)openProject(r.p.id);};
let audioOK=false,lastBellHour=new Date().getHours();
$("#bell").onclick=function(){audioOK=!audioOK;this.classList.toggle('on',audioOK);if(audioOK){beep();toast("Som do sino ativado.");}else toast("Som do sino desativado.");};
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=880;g.gain.value=.0001;o.start();g.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.6);o.stop(ctx.currentTime+.65);}catch(e){}}

function tickClock(){const el=$("#clockT");if(el){el.textContent=new Date().toLocaleTimeString('pt-BR');const cd=$("#clockD");if(cd)cd.textContent='Horário local';}}
/* Guarda de inatividade: se o app dormir/fechar por muito tempo com cronômetro rodando, não conta esse período */
const IDLE_LIMIT=15*60*1000;
function skipIdle(ms,motivo){let any=false;DB.projects.forEach(p=>p.timers.forEach(t=>{if(t.status==='running'&&t.startedAt){t.startedAt+=ms;tHist(t,'Ignorado '+fmt(Math.round(ms/1000))+' de inatividade ('+motivo+').');any=true;}}));if(any)save();return any;}
(function(){const ls=DB.prefs._lastSeen;if(ls){const gap=Date.now()-ls;if(gap>IDLE_LIMIT&&skipIdle(gap,'app estava fechado'))setTimeout(()=>toast('Ignorei o tempo em que o app ficou fechado em cronômetro(s) que estavam rodando.'),900);}})();
let _lastTick=Date.now();
setInterval(()=>{
  const now=Date.now();const gap=now-_lastTick;_lastTick=now;DB.prefs._lastSeen=now;
  if(gap>IDLE_LIMIT&&skipIdle(gap,'computador dormiu'))toast('Ignorei inatividade em cronômetro(s) que ficaram rodando.');
  tickClock();
  $$("[data-elapsed]").forEach(el=>{const id=el.getAttribute('data-elapsed');let t=null;DB.projects.forEach(p=>p.timers.forEach(x=>{if(x.id===id)t=x;}));if(t){el.innerHTML=(t.status==='running'?'<span class="dot"></span>':'')+fmt(elapsed(t));}});
  updateProjectKpis();
  const r=runningList();if(r.length&&current!=='projeto'){$("#fab").classList.add('show');$("#fabT").textContent=r[0].t.name+" · "+fmt(elapsed(r[0].t));$("#fabN").textContent=r.length>1?(r.length+" rodando · toque para voltar"):"Rodando · toque para voltar";}else if(current!=='projeto')$("#fab").classList.remove('show');
  const h=new Date().getHours();if(h!==lastBellHour){lastBellHour=h;if(DB.prefs.bell&&audioOK&&anyRunning()){beep();toast("🔔 "+pad(h)+":00");}}
},1000);
// salvar periodicamente (garante persistência de tempo em execução)
setInterval(save,15000);
window.addEventListener('beforeunload',save);

/* ============================ INIT ============================ */
applyProfile(DB.prefs.profile||'ambar');
refreshProfile();
renderInicio();
</script>
